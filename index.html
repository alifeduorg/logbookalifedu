<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Alif Edu Logbook</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #001f3f;
      font-family: 'Segoe UI', sans-serif;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      flex-direction: column;
    }

    .logbook-card {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      padding: 30px;
      max-width: 800px;
      width: 90%;
      margin: 20px;
    }

    h2 {
      text-align: center;
      color: #001f3f;
    }

    label {
      display: block;
      margin: 10px 0 5px;
      font-weight: 600;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-bottom: 15px;
      font-size: 1rem;
    }

    textarea {
      resize: vertical;
    }

    .button-group {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: space-between;
    }

    .submit-btn {
      background-color: #f1c40f;
      color: #000;
      font-weight: bold;
      border: none;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
      flex: 1;
    }

    .submit-btn:hover {
      background-color: #d4ac0d;
    }

    .dashboard-btn {
      background-color: #ffffff;
      color: #001f3f;
      border: 2px solid #001f3f;
      font-weight: bold;
      padding: 12px 20px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.3s;
      flex: 1;
    }

    .dashboard-btn:hover {
      background-color: #001f3f;
      color: #ffffff;
    }

    .footer {
      text-align: center;
      color: #fff;
      margin: 20px 0;
    }

    @media (max-width: 600px) {
      .logbook-card {
        padding: 20px;
      }

      .button-group {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

<div class="logbook-card">
  <h2>Logbook Entry - Alif Edu</h2>
  <form id="logbookForm">
    <!-- All input fields (same as before) -->
    <label>Date</label>
    <input type="date" name="date" required>

    <label>Teacher’s Name</label>
    <input type="text" name="teacherName" required>

    <label>Staff ID</label>
    <input type="text" name="staffId" required>

    <label>Program</label>
    <select name="program" required>
      <option value="">Select Program</option>
      <option>Little Learner</option>
      <option>Kinder Pre-School</option>
      <option>Horizon (Class 10)</option>
      <option>College</option>
    </select>

    <label>Class</label>
    <select name="class" required>
      <option value="">Select Class</option>
      <option>KG</option>
      <option>Class 1</option>
      <option>Class 2</option>
      <option>Class 3</option>
      <option>Class 4</option>
      <option>Class 5</option>
      <option>Class 6</option>
      <option>Class 7</option>
      <option>Class 8</option>
      <option>Class 9</option>
      <option>Class 10</option>
      <option>Degree</option>
    </select>

    <label>Student Name</label>
    <input type="text" name="studentName" required>

    <label>Subjects</label>
    <select name="subjects" required>
      <option value="">Select Subject</option>
      <option>Math</option>
      <option>Science</option>
      <option>English</option>
      <option>Social Science</option>
      <option>Hindi</option>
      <option>Arabic</option>
      <option>Computer</option>
    </select>

    <label>Class In (Time)</label>
    <input type="time" name="classIn" required>

    <label>Class Duration</label>
    <select name="classDuration" required>
      <option value="">Select Duration</option>
      <option>30 minutes</option>
      <option>45 minutes</option>
      <option>1 hour</option>
      <option>1.5 hours</option>
    </select>

    <label>What did you teach today?</label>
    <textarea name="teachToday" rows="2" required></textarea>

    <label>Student Engagement</label>
    <textarea name="studentEngagement" rows="2" required></textarea>

    <label>Homework or Tasks Given?</label>
    <textarea name="homework" rows="2"></textarea>

    <label>What type of Work</label>
    <select name="workType" required>
      <option value="">Select Type</option>
      <option>Classwork</option>
      <option>Homework</option>
      <option>Assessment</option>
      <option>Revision</option>
    </select>

    <label>Upload Class Notification Message</label>
    <textarea name="uploadMessage" rows="2"></textarea>

    <label>Anything you'd like to share?</label>
    <textarea name="additionalNotes" rows="2"></textarea>

    <div class="button-group">
      <button class="submit-btn" type="submit">Submit</button>
      <button class="dashboard-btn" type="button" onclick="goToDashboard()">Go to Dashboard</button>
    </div>
  </form>
</div>

<div class="footer">
  Powered by <strong>Alif Edu</strong>
</div>

<script>
  const form = document.getElementById('logbookForm');
  form.addEventListener('submit', async function(e) {
    e.preventDefault();

    const formData = new FormData(form);
    const data = {};
    formData.forEach((value, key) => data[key] = value);

    try {
      const response = await fetch("https://script.google.com/macros/s/AKfycbzg07s9nDxSflsc7OE28lzz7FGlaFkjQFGItcVovfFtDufg3kgFpXj4ZS0_jeP0CAguJw/exec", {
        method: "POST",
        body: JSON.stringify(data),
        headers: {
          "Content-Type": "application/json"
        }
      });
      if (response.ok) {
        alert("Logbook submitted successfully!");
        form.reset();
      } else {
        alert("Error submitting the logbook.");
      }
    } catch (error) {
      alert("Connection error. Please try again.");
    }
  });

  function goToDashboard() {
    window.location.href = "https://your-dashboard-link.com"; // Change this to your dashboard URL
  }
</script>

</body>
</html>
