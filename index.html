<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>1Alif Edu Log Book</title>
  <style>
    body {
      margin: 0;
      background: navy;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .logbook-card {
      background: white;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 15px 25px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 600px;
      transform: rotateX(5deg);
      transition: all 0.3s ease-in-out;
    }

    .logbook-card:hover {
      transform: rotateX(0deg);
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.5);
    }

    h2 {
      text-align: center;
      color: navy;
      margin-bottom: 20px;
    }

    label {
      font-weight: bold;
      display: block;
      margin: 15px 0 5px;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      margin-bottom: 10px;
    }

    textarea {
      resize: vertical;
    }

    .submit-btn {
      background: goldenrod;
      color: white;
      border: none;
      padding: 12px;
      font-size: 16px;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
    }

    .submit-btn:hover {
      background: darkgoldenrod;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: white;
    }

    @media (max-width: 600px) {
      .logbook-card {
        padding: 20px;
        transform: none;
      }
    }
  </style>
</head>
<body>

  <form id="logbook-form" class="logbook-card">
    <h2>Class Log Book</h2>

    <label>Teacher’s Name</label>
    <input type="text" name="teacher" required />

    <label>Staff ID</label>
    <input type="text" name="staffID" required />

    <label>Program</label>
    <select name="program" required>
      <option value="" disabled selected>Select Program</option>
      <option>Kinder Pre-School</option>
      <option>Little Learner</option>
      <option>Horizon</option>
      <option>Degree/Madrasa</option>
    </select>

    <label>Class</label>
    <select name="className" required>
      <option value="" disabled selected>Select Class</option>
      <option>KG</option>
      <option>Class 1</option>
      <option>Class 2</option>
      <option>Class 3</option>
      <option>Class 4</option>
      <option>Class 5</option>
      <option>Class 6</option>
      <option>Class 7</option>
      <option>Class 8</option>
      <option>Class 9</option>
      <option>Class 10</option>
      <option>Degree</option>
    </select>

    <label>Student Name</label>
    <input type="text" name="student" required />

    <label>Subjects</label>
    <select name="subject" required>
      <option value="" disabled selected>Select Subject</option>
      <option>Maths</option>
      <option>Science</option>
      <option>English</option>
      <option>Malayalam</option>
      <option>Social Science</option>
      <option>Computer</option>
      <option>Islamic Studies</option>
    </select>

    <label>Class In</label>
    <input type="time" name="classIn" required />

    <label>Class Duration</label>
    <select name="duration" required>
      <option value="" disabled selected>Select Duration</option>
      <option>30 mins</option>
      <option>45 mins</option>
      <option>1 hour</option>
      <option>1.5 hours</option>
    </select>

    <label>What did you teach today?</label>
    <textarea name="taught" rows="2" required></textarea>

    <label>Student Engagement</label>
    <textarea name="engagement" rows="2" required></textarea>

    <label>Homework or Tasks Given?</label>
    <textarea name="homework" rows="2"></textarea>

    <label>What type of Work</label>
    <select name="workType">
      <option value="" disabled selected>Select Work Type</option>
      <option>Worksheet</option>
      <option>Reading</option>
      <option>Activity</option>
      <option>Project</option>
      <option>None</option>
    </select>

    <label>Upload Class Notification Message</label>
    <textarea name="notification" rows="2"></textarea>

    <label>Anything you'd like to share?</label>
    <textarea name="extra" rows="2"></textarea>

    <button type="submit" class="submit-btn">Go to Dashboard & Submit</button>

    <div class="footer">Powered by Alif Edu</div>
  </form>

  <script>
    document.getElementById('logbook-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const form = e.target;
      const data = {
        date: new Date().toLocaleDateString(),
        teacher: form.teacher.value,
        staffID: form.staffID.value,
        program: form.program.value,
        className: form.className.value,
        student: form.student.value,
        subject: form.subject.value,
        classIn: form.classIn.value,
        duration: form.duration.value,
        taught: form.taught.value,
        engagement: form.engagement.value,
        homework: form.homework.value,
        workType: form.workType.value,
        notification: form.notification.value,
        extra: form.extra.value
      };

      fetch("https://script.google.com/macros/s/AKfycbzg07s9nDxSflsc7OE28lzz7FGlaFkjQFGItcVovfFtDufg3kgFpXj4ZS0_jeP0CAguJw/exec", {
        method: "POST",
        body: JSON.stringify(data),
        headers: { "Content-Type": "application/json" }
      })
      .then(res => res.text())
      .then(res => alert("Logbook submitted successfully!"))
      .catch(err => alert("Error: " + err.message));
    });
  </script>

</body>
</html>
